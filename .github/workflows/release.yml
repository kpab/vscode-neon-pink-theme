name: Release

# Publishing used to be `vsce publish` from a laptop, which is why v0.1.0
# through v0.4.0 have GitHub Releases with no VSIX attached and the README's
# download link resolved to nothing. Pushing a `v*` tag now does all of it.
#
# Both publish steps are skipped when their token is not configured, so the
# workflow still produces a GitHub Release with the VSIX attached on a
# repository that has no Marketplace credentials:
#
#   VSCE_PAT  Azure DevOps PAT for the `kpab` publisher (Marketplace)
#   OVSX_PAT  Open VSX access token (VSCodium, Cursor and other forks)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    # Job level rather than step level: a step's `if` cannot read the secrets
    # context, and cannot read its own `env` either.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # A tag that disagrees with the manifest would publish the wrong version
      # number to the Marketplace, where it cannot be taken back.
      - name: Check tag against package.json
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$MANIFEST" ]; then
            echo "Tag $TAG does not match package.json version $MANIFEST." >&2
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "vsix=neon-pink-dark-$MANIFEST.vsix" >> "$GITHUB_OUTPUT"

      - name: Validate
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce package --out "${{ steps.version.outputs.vsix }}"

      # Fails if the version has no CHANGELOG section, before anything has been
      # published.
      - name: Build release notes
        run: node scripts/extract-changelog.js "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "${{ steps.version.outputs.vsix }}" --pat "$OVSX_PAT"

      # Last, so a Marketplace rejection does not leave a Release announcing a
      # version that was never published.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.version.outputs.vsix }}" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "${{ steps.version.outputs.vsix }}" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Report what was skipped
        run: |
          [ -n "$VSCE_PAT" ] || echo "::warning::VSCE_PAT is not set — nothing was published to the Marketplace."
          [ -n "$OVSX_PAT" ] || echo "::warning::OVSX_PAT is not set — nothing was published to Open VSX."
