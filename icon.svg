<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="128" height="128" fill="#000000"/>

  <!-- Outer glow circle -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#FF2DBE" stroke-width="2" opacity="0.3"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#FF2DBE" stroke-width="3" opacity="0.5"/>

  <!-- Main neon circle -->
  <circle cx="64" cy="64" r="35" fill="none" stroke="#FF2DBE" stroke-width="4">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner design - hexagon -->
  <polygon points="64,34 82,44 82,64 64,74 46,64 46,44"
           fill="none" stroke="#FF8CF0" stroke-width="3"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="8" fill="#FF2DBE">
    <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Accent lines -->
  <line x1="64" y1="20" x2="64" y2="28" stroke="#FF2DBE" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="100" x2="64" y2="108" stroke="#FF2DBE" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="28" y2="64" stroke="#FF2DBE" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="64" x2="108" y2="64" stroke="#FF2DBE" stroke-width="2" stroke-linecap="round"/>
</svg>
